# ============================================================
# 2号线：看板自动化线 — GitHub Actions 抓取模板（不部署）
# 文件位置（部署时）：.github/workflows/fetch.yml
# 仓库：建议用 GitHub 账号 snwz9999-ship-it 下的私人仓
#       （待 Chris 确认仓库名；见 DESIGN.md 第 0 节）
# 日期：2026-11-09
#
# 设计要点：
#  1. cron 一律写 UTC。CST = UTC+8。
#     09:37 CST = 01:37 UTC；10:37 CST = 02:37 UTC。
#     每 2 小时用 '7 */2 * * *'，避开整点高峰，减少 GitHub 延迟。
#  2. 最小间隔 5 分钟（GitHub 官方限制），本模板最密是 2 小时，
#     远未触线。高峰期定时任务可能延迟，不要指望分秒不差。
#  3. 按来源分 job，单路失败不拖垮其他路；每个 job 都写 fetch_logs，
#     失败也要写，空间页脚的“某路失败，保留旧数据”就读这张表。
#  4. 失败不删旧数据：任何 job 失败时只记日志、不跑清理、
#     不把 items 置 expired。清理是单独的 cleanup job。
#  5. 密钥只走 Secrets：SUPABASE_URL、SUPABASE_SERVICE_ROLE_KEY。
#     不要把真实 key 写进这个文件、不要提交到仓库、不要发聊天。
#     Service Key 只给 Actions 用，Worker 绝不用它。
#  6. 零付费护栏：不要在 GitHub 账号上绑卡；无卡时，
#     用完免费额度后任务会被拦停而不是扣费（官方说明，见 DESIGN.md）。
#     私人仓免费额度约 2000 Linux 分钟/月（$12 等值），
#     本模板估算约 1500 分钟/月，见 DESIGN.md 第 1.3 节。
#     公开仓标准 Runner 不计分钟，但密钥与抓取逻辑会公开可见，
#     除非 Chris 明确改公开仓，否则默认私人仓。
# ============================================================

name: fetch-boards

on:
  schedule:
    # 热点 + 羊毛墙：每 2 小时。UTC 00:07、02:07、04:07 …（CST 08:07、10:07 …）
    - cron: '7 */2 * * *'
    # 打新看板：每天 01:37 UTC = 09:37 CST
    - cron: '37 1 * * *'
    # 低门槛复核（只标过期、不删）：每天 02:37 UTC = 10:37 CST
    - cron: '37 2 * * *'
    # 清理：每天 03:07 UTC = 11:07 CST，只删已过期且超保留期的旧快照
    - cron: '7 3 * * *'
  # 手动触发：调试、补抓用。不要用它做日常刷新。
  workflow_dispatch:
    inputs:
      board:
        description: '只跑哪块板（all / hot / deals / jettt / low_threshold / cleanup）'
        required: false
        default: 'all'
        type: choice
        options: [all, hot, deals, jettt, low_threshold, cleanup]

# 只读权限。写 Supabase 不走 GitHub Token，走 Secrets 里的 Service Key。
permissions:
  contents: read

# 同一时刻只跑一份，避免两轮重叠写库。
concurrency:
  group: fetch-boards
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------
  # 热点板：百度 / 头条 / 知乎 / B站，四路并行
  # 复用：现有空间的四路公开榜单抓取逻辑（见 DESIGN.md 第 2 节）。
  # 脚本契约（scripts/ 下的文件本次只定接口，不在本设计里写实现）：
  #   - 每个脚本只抓一路，输出统一 JSON，字段见 DESIGN.md 第 3.4 节。
  #   - 部分成功时退出码仍为 0，但要在 fetch_logs 里记 partial，
  #     并把失败的那路标 degraded，不要让整个 job 变红后误以为全败。
  #   - 任何一路失败都不删除该路的旧 items。
  # ----------------------------------------------------------
  fetch-hot:
    # 定时触发时：只在 2 小时那班跑；手动触发时按 inputs.board 跑。
    if: github.event_name == 'schedule' || inputs.board == 'all' || inputs.board == 'hot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [baidu, toutiao, zhihu, bilibili]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch one source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOURCE_ID: ${{ matrix.source }}
          BOARD: hot
        # 脚本必须做到：失败也写 fetch_logs（status=failed），
        # 成功 / 部分成功写 ok / partial；退出码失败时，
        # continue-on-error 让矩阵里其他路继续跑。
        run: python scripts/fetch_source.py --source "$SOURCE_ID" --board "$BOARD"
        continue-on-error: true

  # ----------------------------------------------------------
  # 羊毛墙：NodeSeek / V2EX / LINUX DO / 小众软件，四路并行
  # 复用：现有 7 分类 + 有效期标注 + 保留 7 天规则。
  # 注意：
  #  - 只收优惠帖，问答 / 吐槽 / 经历帖不混入（现有分类器规则）。
  #  - LINUX DO 可能被 Cloudflare 拦：脚本遇到 403 / Challenge 页
  #    时直接记 failed + degraded，不重试绕过、不换 UA 伪装、
  #    不上无头浏览器硬闯，保留其他三路的旧数据继续展示。
  #  - 原帖未标注有效期时，脚本要把 expires_at 写成 fetched_at + 7 天，
  #    并在 expires_note 写“原帖未标注有效期 · 看板保留至 YYYY-MM-DD”。
  # ----------------------------------------------------------
  fetch-deals:
    if: github.event_name == 'schedule' || inputs.board == 'all' || inputs.board == 'deals'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [nodeseek, v2ex, linuxdo, xiaozhong]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch one source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOURCE_ID: ${{ matrix.source }}
          BOARD: deals
        run: python scripts/fetch_source.py --source "$SOURCE_ID" --board "$BOARD"
        continue-on-error: true

  # ----------------------------------------------------------
  # 打新看板：Jettt mint / Unity 新盘 / Unity 热度榜 / 聪明钱包
  # 复用：现有四路公开 JSON 抓取逻辑；只展示、不交易。
  # 注意：每天只跑一次（01:37 UTC），不要改成 2 小时，
  # 否则会放大上游 JSON 变动带来的噪音，且无必要。
  # ----------------------------------------------------------
  fetch-jettt:
    if: github.event_name == 'schedule' || inputs.board == 'all' || inputs.board == 'jettt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [jettt_mint, unity_launches, unity_ranking, smart_wallets]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch one source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOURCE_ID: ${{ matrix.source }}
          BOARD: jettt
        run: python scripts/fetch_source.py --source "$SOURCE_ID" --board "$BOARD"
        continue-on-error: true

  # ----------------------------------------------------------
  # 低门槛清单：不抓取，只复核过期
  # 这块是人工核查的 36 条清单，不是爬虫产物。
  # 每天跑一次：把 expires_at 已过的标 expired，不删除，
  # 等 Chris / Muse 在 Supabase Dashboard 里人工确认后再删。
  # 新条目也只在 Dashboard 里加，不由脚本写。
  # ----------------------------------------------------------
  review-low-threshold:
    if: github.event_name == 'schedule' || inputs.board == 'all' || inputs.board == 'low_threshold'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Mark expired (no delete)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/review_low_threshold.py --mark-expired-only

  # ----------------------------------------------------------
  # 清理：每天一次，单独 job
  # 只删已过期且超保留期的旧快照（规则见 schema.sql 第 5 节）。
  # 失败时不影响抓取 job；抓取 job 失败时不跑清理（靠分开的 cron）。
  # ----------------------------------------------------------
  cleanup:
    if: github.event_name == 'schedule' || inputs.board == 'all' || inputs.board == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [] # 不依赖抓取 job，避免某路失败就跳过清理
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Cleanup expired snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/cleanup.py --dry-run-check
        # 上线第一周先用 --dry-run-check 只打印将要删的数量，
        # 确认无误后再去掉该参数，改成真正执行。不要第一天就真删。
